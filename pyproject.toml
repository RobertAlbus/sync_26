[project]
name = "digital-audio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["manim>=0.21,<0.22", "manim-slides[pyside6]>=5.7"]

[tool.uv]
package = false

[dependency-groups]
dev = ["poethepoet>=0.48"]

[tool.poe.tasks.render]
cmd = "manim-slides render -- -ql 00_main.py ${_scenes}"
uses = { _scenes = "_scene-names" }

[tool.poe.tasks.render-hq]
cmd = "manim-slides render -- -qh 00_main.py ${_scenes}"
uses = { _scenes = "_scene-names" }

[tool.poe.tasks.present]
cmd = "manim-slides present ${_scenes}"
uses = { _scenes = "_scene-names" }

[tool.poe.tasks.html]
cmd = "manim-slides convert ${_scenes} presentation.html --one-file"
uses = { _scenes = "_scene-names" }

[tool.poe.tasks.flush]
cmd = "rm -rf media slides presentation.html presentation_assets"

[tool.poe.tasks._scene-names]
script = "_scenes:scene_names"
print_result = true
